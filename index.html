<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>같이 모여 - 온라인 미팅</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="landing-wrap">
    <!-- 초기 화면 -->
    <div id="view-landing" class="card view">
      <h1>같이 모여</h1>
      <p class="sub">시간 제한 없이, 친구들끼리 캠/마이크로 모이는 공간</p>
      <div class="big-actions">
        <button id="btn-start" class="btn btn-primary">온라인 미팅 시작하기</button>
        <button id="btn-join" class="btn btn-secondary">참여하기</button>
      </div>

      <div class="meeting-list-section">
        <h2>공개 미팅 목록</h2>
        <div id="public-meeting-items" class="meeting-list">
          <p class="meeting-list-empty">불러오는 중...</p>
        </div>
      </div>
    </div>

    <!-- 방 만들기 권한 확인 화면 -->
    <div id="view-creator-code" class="card view hidden">
      <h1>방 만들기</h1>
      <p class="sub">미리 받은 6자리 코드를 입력하면 방을 만들 수 있어요. (코드가 없다면 초대받은 방에 "참여하기"로 들어가주세요)</p>
      <form id="form-creator-code">
        <label for="input-creator-code">코드</label>
        <input
          id="input-creator-code"
          type="text"
          inputmode="numeric"
          pattern="\d{6}"
          maxlength="6"
          placeholder="6자리 숫자"
          autocomplete="off"
        />
        <div class="error-text" id="creator-code-error"></div>
        <div class="form-actions">
          <button type="button" class="btn btn-text btn-back">뒤로</button>
          <button type="submit" class="btn btn-primary">확인</button>
        </div>
      </form>
    </div>

    <!-- 미팅 시작하기 화면 -->
    <div id="view-create" class="card view hidden">
      <h1>미팅 시작하기</h1>
      <p class="sub">방 이름을 정하면 초대 링크와 코드가 발급돼요.</p>
      <form id="form-create">
        <label for="input-room-name">방 이름</label>
        <input
          id="input-room-name"
          type="text"
          maxlength="30"
          placeholder="예: 토요일 스터디"
          autocomplete="off"
        />
        <label for="input-nickname-create">닉네임</label>
        <input
          id="input-nickname-create"
          type="text"
          maxlength="20"
          placeholder="다른 사람들에게 보여질 이름"
          autocomplete="off"
        />

        <label>공개 여부</label>
        <div class="form-radio-group">
          <label class="form-radio-option">
            <input type="radio" name="visibility" value="private" checked />
            비공개 (초대코드/링크로만 참여)
          </label>
          <label class="form-radio-option">
            <input type="radio" name="visibility" value="public" />
            공개 (미팅 목록에 표시)
          </label>
        </div>

        <div id="create-password-wrap" class="hidden">
          <label for="input-room-password">비밀번호 (선택, 4~6자리 숫자)</label>
          <input
            id="input-room-password"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="비워두면 퍼블릭(누구나 참여)으로 표시돼요"
            autocomplete="off"
          />
        </div>

        <div class="error-text" id="create-error"></div>
        <div class="form-actions">
          <button type="button" class="btn btn-text btn-back">뒤로</button>
          <button type="submit" class="btn btn-primary">미팅 만들기</button>
        </div>
      </form>
    </div>

    <!-- 참여하기 화면 -->
    <div id="view-join" class="card view hidden">
      <h1>참여하기</h1>
      <p class="sub">받은 초대코드를 입력하세요. (링크로 들어왔다면 자동 입력돼요)</p>
      <form id="form-join">
        <label for="input-code">초대코드</label>
        <input
          id="input-code"
          type="text"
          maxlength="6"
          placeholder="예: FX92KD"
          autocomplete="off"
          style="text-transform: uppercase; letter-spacing: 0.1em"
        />
        <label for="input-nickname-join">닉네임</label>
        <input
          id="input-nickname-join"
          type="text"
          maxlength="20"
          placeholder="다른 사람들에게 보여질 이름"
          autocomplete="off"
        />
        <label for="input-join-password">비밀번호 (필요한 방만 입력)</label>
        <input
          id="input-join-password"
          type="text"
          inputmode="numeric"
          maxlength="6"
          placeholder="비밀번호가 있는 방이면 입력해주세요"
          autocomplete="off"
        />
        <div class="error-text" id="join-error"></div>
        <div class="form-actions">
          <button type="button" class="btn btn-text btn-back">뒤로</button>
          <button type="submit" class="btn btn-primary">참여하기</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
