<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>미팅 중 - 같이 모여</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 카메라/마이크 권한 요청, 방 확인 중 -->
  <div id="state-loading" class="center-state">
    <div class="spinner"></div>
    <p id="loading-text">캠/마이크 권한을 요청하고 있어요...</p>
  </div>

  <!-- 방을 찾을 수 없거나 캠/마이크 권한 문제일 때 -->
  <div id="state-error" class="center-state hidden">
    <p id="error-text" class="error-message"></p>
    <div class="stacked-actions">
      <button id="btn-retry" class="btn btn-secondary">다시 시도</button>
      <a href="index.html" class="btn btn-text">처음으로 돌아가기</a>
    </div>
  </div>

  <!-- 실제 미팅 화면 -->
  <div id="state-room" class="room-state hidden">
    <div class="room-header">
      <div class="room-header-title">
        <strong id="room-name-label">미팅</strong>
        <span id="elapsed-time" class="elapsed-time">00:00</span>
      </div>
      <div class="room-info">
        <span>초대코드</span>
        <span class="room-code-chip" id="room-code-label"></span>
        <button class="copy-btn" id="btn-copy-code">코드 복사</button>
        <button class="copy-btn" id="btn-copy-link">링크 복사</button>
        <div class="sound-settings-wrap">
          <div id="sound-settings-popover" class="sound-settings-popover hidden">
            <label class="chat-settings-row sound-master-row">
              <input type="checkbox" id="sound-master-toggle" />
              <span>전체 알림음</span>
            </label>
            <div class="sound-settings-list" id="sound-settings-list"></div>
          </div>
          <button class="copy-btn" id="btn-sound-settings" title="알림음 설정">🔔</button>
        </div>
      </div>
    </div>

    <div class="room-body">
      <div class="video-grid" id="video-grid">
        <div id="main-stage" class="main-stage hidden"></div>
        <div id="tile-row" class="tile-row"></div>
      </div>

      <div id="chat-panel" class="chat-panel">
        <div class="panel-resizer" data-panel="chat"></div>
        <div class="chat-panel-header">
          <strong>채팅</strong>
          <div class="chat-header-actions">
            <button class="copy-btn" id="btn-chat-settings" title="채팅 미리보기 설정">⚙️</button>
            <button class="copy-btn" id="btn-close-chat">닫기</button>
          </div>
        </div>
        <div id="chat-settings-popover" class="chat-settings-popover hidden">
          <label class="chat-settings-row">
            <input type="checkbox" id="chat-preview-toggle" />
            <span>채팅 안 열었을 때 새 메시지 미리보기</span>
          </label>
          <div class="chat-settings-row chat-settings-duration">
            <span>유지 시간</span>
            <div class="chat-duration-options" id="chat-duration-options">
              <button type="button" class="duration-option" data-duration="3000">3초</button>
              <button type="button" class="duration-option" data-duration="5000">5초</button>
              <button type="button" class="duration-option" data-duration="8000">8초</button>
            </div>
          </div>
        </div>
        <div class="chat-messages-wrap">
          <div id="chat-messages" class="chat-messages">
            <p class="chat-empty">아직 메시지가 없어요</p>
          </div>
          <button type="button" id="btn-new-message" class="new-message-indicator hidden">↓ 새 메시지</button>
        </div>
        <form id="chat-form" class="chat-form">
          <textarea id="chat-input" rows="1" maxlength="500" placeholder="메시지 입력..."></textarea>
          <button type="submit" class="btn btn-primary">전송</button>
        </form>
      </div>

      <div id="participants-panel" class="chat-panel">
        <div class="panel-resizer" data-panel="participants"></div>
        <div class="chat-panel-header">
          <strong>참가자</strong>
          <button class="copy-btn" id="btn-close-participants">닫기</button>
        </div>
        <div id="participants-list" class="participants-list"></div>
      </div>
    </div>

    <div class="controls">
      <button class="icon-btn" id="btn-toggle-mic" title="마이크 켜기/끄기">🎤</button>
      <button class="icon-btn" id="btn-toggle-cam" title="캠 켜기/끄기">📷</button>
      <button class="icon-btn" id="btn-screen-share" title="화면 공유">🖥️</button>
      <button class="icon-btn" id="btn-raise-hand" title="손 들기">✋</button>
      <div class="reaction-wrap">
        <div id="reaction-picker" class="reaction-picker"></div>
        <button class="icon-btn" id="btn-reaction" title="리액션">😊</button>
      </div>
      <button class="icon-btn" id="btn-toggle-participants" title="참가자 목록">
        👥
        <span id="participants-count" class="chat-badge">1</span>
      </button>
      <button class="icon-btn" id="btn-toggle-chat" title="채팅">
        💬
        <span id="chat-badge" class="chat-badge hidden"></span>
      </button>
      <button class="icon-btn leave" id="btn-leave">나가기</button>
    </div>

    <div id="toast" class="toast" role="status"></div>
    <div id="chat-toast-stack" class="chat-toast-stack" aria-live="polite"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/room.js"></script>
</body>
</html>
